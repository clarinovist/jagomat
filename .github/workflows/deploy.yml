name: Build & Deploy

# Migrasi pilot: full suite, probe image dan uji pasangan wajib; pasang literal false.
# Recovery e206563 memperbaiki kalender WIB; suite dan image diuji bersama kandidat.
# Cutover memakai approval exact pair, backup dan rehearsal terkontrol.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRI: ghcr.io
  # Identitas artefak tetap meski repo berganti nama menjadi jagomat.
  # Harus sama dengan verifier dan deployer; recovery VPS memakai namespace ini.
  IMAGE: clarinovist/osn-mesin-latihan
  # Baseline memahami opsi, admin5, arsip konteks dan konfirmasi pilot.
  RECOVERY_SHA: e206563468afb805af9612711f3c4d0f9ec81539

jobs:
  # Kandidat dan recovery masing-masing memakai empat runner terisolasi.
  # Tiap runner serial; jangan xdist karena test HTTP berbagi socket.
  uji_kandidat:
    name: Test kandidat ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          # Test candidate mengekstrak source recovery pinned lewat git archive.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Pasang pytest
        run: pip install --quiet pytest pytest-xdist
      - name: Pastikan tidak ada data siswa ter-commit
        run: python scripts/check_repo.py
      - name: Jalankan shard kandidat dan catat manifest
        run: |
          python scripts/pytest_shard.py \
            --shard "${{ matrix.shard }}" --total 4 \
            --manifest "shard-manifests/kandidat-${{ matrix.shard }}.json" \
            --revision "$GITHUB_SHA" -- \
            --rootdir . mesin/__tests__/ -q -W error -p no:cacheprovider --durations=20
      - name: Simpan bukti shard kandidat
        uses: actions/upload-artifact@v4
        with:
          name: kandidat-shard-${{ matrix.shard }}
          path: shard-manifests/kandidat-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7

  uji:
    name: Test kandidat
    needs: uji_kandidat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Pasang pytest untuk helper verifikasi
        run: pip install --quiet pytest
      - uses: actions/download-artifact@v4
        with:
          pattern: kandidat-shard-*
          path: shard-manifests
          merge-multiple: true
      - name: Buktikan semua test kandidat lulus tepat sekali
        run: >-
          python scripts/verify_pytest_shards.py
          --directory shard-manifests --total 4 --revision "$GITHUB_SHA"

  uji_recovery:
    name: Test recovery ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # Helper shard berasal dari candidate yang juga melewati full suite.
      - uses: actions/checkout@v7
      - name: Checkout baseline recovery kalender WIB
        uses: actions/checkout@v7
        with:
          ref: e206563468afb805af9612711f3c4d0f9ec81539
          path: recovery
          # Suite recovery mempertahankan mode dan pin historis source-nya sendiri.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Pasang pytest
        run: pip install --quiet pytest pytest-xdist
      - name: Palang dan shard recovery terisolasi
        working-directory: recovery
        shell: bash
        run: |
          python scripts/check_repo.py
          python - <<'PY'
          import os, pathlib, sys
          assert pathlib.Path.cwd().name == 'recovery'
          sys.path.insert(0, str(pathlib.Path('mesin').resolve()))
          import assistant_schema
          assert pathlib.Path(assistant_schema.__file__).resolve().parent == pathlib.Path('mesin').resolve()
          assert assistant_schema.VERSI_SKEMA == 4
          print('Canary: import recovery terisolasi, schema v4')
          PY
          python ../scripts/pytest_shard.py \
            --shard "${{ matrix.shard }}" --total 4 -- \
            --rootdir . mesin/__tests__/ -q -W error -p no:cacheprovider --durations=20

  bangun:
    name: Build & Push
    needs: [uji, uji_recovery]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.dorong.outputs.digest }}
      recovery_digest: ${{ steps.recovery.outputs.digest }}
      siap_pasang: ${{ steps.metadata.outputs.siap_pasang }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: e206563468afb805af9612711f3c4d0f9ec81539
          path: recovery
      - name: Validasi mode dan gate rilis sebelum build
        id: mode
        run: |
          set -euo pipefail
          python scripts/release_metadata.py --check
          python - <<'PY'
          import json, os
          from pathlib import Path
          mode = json.loads(Path('scripts/release-metadata.json').read_text())['mode']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('mode=' + mode, file=output)
          PY
      - uses: docker/setup-buildx-action@v4
      - name: Masuk ke GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRI }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bangun dan dorong candidate
        id: dorong
        uses: docker/build-push-action@v7
        with:
          context: ./mesin
          push: true
          tags: ${{ env.REGISTRI }}/${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=candidate
          cache-to: type=gha,scope=candidate,mode=max
      - name: Bangun dan dorong baseline recovery pinned
        id: recovery
        uses: docker/build-push-action@v7
        with:
          context: ./recovery/mesin
          push: true
          tags: ${{ env.REGISTRI }}/${{ env.IMAGE }}:recovery-${{ env.RECOVERY_SHA }}
          labels: |
            org.opencontainers.image.revision=${{ env.RECOVERY_SHA }}
          cache-from: type=gha,scope=recovery
          cache-to: type=gha,scope=recovery,mode=max
      - name: Verifikasi image berdasarkan digest output build yang sama
        env:
          CANDIDATE_DIGEST: ${{ steps.dorong.outputs.digest }}
          RECOVERY_DIGEST: ${{ steps.recovery.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$REGISTRI/$IMAGE@$CANDIDATE_DIGEST"
          docker pull "$REGISTRI/$IMAGE@$RECOVERY_DIGEST"
          python scripts/verify_release_image.py \
            --image "$REGISTRI/$IMAGE@$CANDIDATE_DIGEST" --revision "$GITHUB_SHA"
          python scripts/verify_release_image.py \
            --image "$REGISTRI/$IMAGE@$RECOVERY_DIGEST" --revision "$RECOVERY_SHA"
          {
            echo "## Artefak rilis terverifikasi"
            echo "Candidate: \`$GITHUB_SHA\` / \`$CANDIDATE_DIGEST\`"
            echo "Recovery: \`$RECOVERY_SHA\` / \`$RECOVERY_DIGEST\`"
            echo "Tidak memakai tag latest sebagai identitas rilis."
            echo "Artefak belum memberi izin pemasangan; lihat mode, kompatibilitas, dan kesiapan pada manifest."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verifikasi recovery terhadap data hasil candidate
        if: ${{ steps.mode.outputs.mode == 'migrasi' || steps.mode.outputs.mode == 'rutin' }}
        env:
          CANDIDATE_DIGEST: ${{ steps.dorong.outputs.digest }}
          RECOVERY_DIGEST: ${{ steps.recovery.outputs.digest }}
        run: |
          set -euo pipefail
          python scripts/verify_submission_pair.py \
            --candidate-image "$REGISTRI/$IMAGE@$CANDIDATE_DIGEST" --candidate-revision "$GITHUB_SHA" \
            --recovery-image "$REGISTRI/$IMAGE@$RECOVERY_DIGEST" --recovery-revision "$RECOVERY_SHA" > submission-pair.json
      - name: Simpan manifest pasangan image
        id: metadata
        env:
          CANDIDATE_DIGEST: ${{ steps.dorong.outputs.digest }}
          RECOVERY_DIGEST: ${{ steps.recovery.outputs.digest }}
          RELEASE_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          bukti=()
          if [ "$RELEASE_MODE" != 'persiapan' ]; then
            bukti=(--pair-proof submission-pair.json)
          fi
          python scripts/release_metadata.py --output release-manifest.json "${bukti[@]}" \
            --candidate-revision "$GITHUB_SHA" --candidate-digest "$CANDIDATE_DIGEST" \
            --recovery-revision "$RECOVERY_SHA" --recovery-digest "$RECOVERY_DIGEST"
          python - <<'PY'
          import json, os
          from pathlib import Path
          hasil = json.loads(Path('release-manifest.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('mode=' + hasil['mode'], file=output)
              print('siap_pasang=' + str(hasil['siap_pasang']).lower(), file=output)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ github.sha }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 30

  pasang:
    name: Deploy ke VPS
    needs: bangun
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Siapkan kunci deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_DEPLOY_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          echo "${{ secrets.VPS_HOST_KEY }}" > ~/.ssh/known_hosts
      - name: Deploy pasangan digest yang sudah lolos verifikasi
        # Policy root mematok recovery, hash deployer, dan kontrak persistensi.
        # Tidak membuat approval migrasi palsu atau mengubah policy dari CI.
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy \
              -o ConnectTimeout=15 -o BatchMode=yes \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              "deploy-rutin-v1 ${{ needs.bangun.outputs.digest }} ${{ needs.bangun.outputs.recovery_digest }}"
      - name: Pastikan situs hidup dari luar
        run: python scripts/smoke_public.py
